<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sala - Truco das Amigas</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="inicio">

        <div class="logo">🃏</div>

        <h1>TRUCO DAS AMIGAS</h1>


        <div class="card">

            <p>
                Código da sala:
            </p>

            <h2 id="codigo"></h2>


            <button onclick="copiarCodigo()">
                📋 Copiar código
            </button>


            <br>
            <br>


            <p id="quantidade">
                0/6 jogadoras
            </p>


            <hr>


            <h2>
                Escolha seu trio
            </h2>


            <div id="escolhaTrio">

                <button
                    onclick="escolherTrio(1)"
                >
                    🔴 Entrar no Trio 1
                </button>


                <br>
                <br>


                <button
                    onclick="escolherTrio(2)"
                >
                    🔵 Entrar no Trio 2
                </button>

            </div>


            <p id="meuTrio"></p>


            <hr>


            <h2>
                🔴 TRIO 1
            </h2>


            <div id="trio1">

                <p>
                    Aguardando jogadoras...
                </p>

            </div>


            <br>


            <h2>
                🔵 TRIO 2
            </h2>


            <div id="trio2">

                <p>
                    Aguardando jogadoras...
                </p>

            </div>


            <br>


            <button
                id="botaoComecar"
                onclick="comecarJogo()"
                disabled
            >
                Aguardando 3 × 3
            </button>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script src="sala.js"></script>

</body>

</html>
